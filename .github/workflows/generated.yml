name: Generated files

# The website (docs/, served by GitHub Pages from the generated branch) and ROADMAP.md are written from main's coverage/
# and main's jar scoreboard after every push to main, and committed to the generated branch, never to main
# (bench/generated.py). main requires a pull request to be up to date before it merges, so a bot commit on main put every
# open pull request behind; on their own branch they cost a pull request nothing. The scoreboard's record job
# (cloud-exposure.yml) publishes the same way when its sweep ends.
# The push uses the DOCS_DEPLOY_KEY deploy key, so GitHub Pages builds the branch (a push by GITHUB_TOKEN may not start it).

on:
  push:
    branches: [main]
    paths:
      - "coverage/**"
      - "bench/**"
      - "docs/**"
      - "knowledge/fixes.json"
      - "tools/cli/Support.java"
      - ".github/workflows/generated.yml"
  workflow_dispatch:

permissions:
  contents: read

# A waiting run is replaced by a newer one: each builds from main as it is then, so the newest has everything.
concurrency:
  group: generated-files
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: generated
          path: .runs/generated
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write the site and ROADMAP.md to the generated branch
        run: python bench/generated.py publish --dir .runs/generated
