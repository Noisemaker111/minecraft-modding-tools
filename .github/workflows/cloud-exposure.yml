name: Cloud jar scoreboard
# The whole jar scoreboard (python bench/exposure.py all) on GitHub's runners: one ubuntu-latest job per group of ports the
# plan makes (python bench/exposure.py updates): each update and jump, and the most-used release's mods to every release,
# where the ports from one release in one direction share a job and one JarPort ports the steps they share once. Each job
# downloads its release's pinned mods (bench/exposure/mods/), ports them with JarPort and links them against each target;
# the summary job joins them into the all-updates table (python bench/exposure.py join). A job downloads about 1 GB (the
# game, its loader, 150 mods) in under a minute, so only small kept answers are cached: each release's registry report
# (its data generator), and the ports and Exposure answers of the sweep before, each under the content of everything it
# reads. A sweep of main ports every mod and asks Exposure everything again (--verify) and fails where a kept answer with
# the same key differs: the check that the cache is exact.
#
# It runs only when started: by hand (tools/cloud-run exposure, or Actions > Run workflow) and by each release
# (release.yml). It is 72 jobs and hundreds of runner-minutes, and ran about 3 times per merged pull request when every PR
# and every push to main started one, so the 20 runners fell hours behind. A pull request gets port-check.yml instead: the
# ports its change can move, against main's table, in about one port's time. A whole sweep of main is main's table:
# generated.yml's record job saves it to the generated branch (scoreboard/all.json) with the headline points.
#
# One failed job of 72 is not a new sweep: the summary job names the ports with no row, and whoever started the run
# re-runs only those (gh run rerun RUN --failed); the summary job runs again with them and joins every attempt's rows. A
# job that fails on the re-run too is a real failure, not a runner's.
run-name: "Cloud jar scoreboard: ${{ inputs.only || 'every update' }} ${{ inputs.request }}"
on:
  workflow_dispatch:
    inputs:
      only:
        description: LOADER:FROM updates, comma-separated (empty for every update of both loaders)
        default: ''
      request:
        description: Set by tools/cloud-run to find the run it started
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      updates: ${{ steps.plan.outputs.updates }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
        run: echo "updates=$(python3 bench/exposure.py updates ${ONLY:+--only "$ONLY"})" >> "$GITHUB_OUTPUT"
  update:
    needs: plan
    name: ${{ matrix.update }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        update: ${{ fromJSON(needs.plan.outputs.updates) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UPDATE: ${{ matrix.update }}
      VERIFY: ${{ github.ref == 'refs/heads/main' && '--verify' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Every entry is kept under the content of what it reads, so any job's cache is right to restore: this job's own
      # from before, else one of a job from the same release (the plan's groups move when a target is added).
      # A cache key may not hold a comma, and a job of several targets is named FROM:TO1,TO2.
      - id: release
        run: |
          echo "prefix=exposure-kept-${UPDATE%:*}:" >> "$GITHUB_OUTPUT"
          echo "job=exposure-kept-${UPDATE//,/+}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.mmt/exposure/registries
            ~/.mmt/exposure/ports
            ~/.mmt/exposure/maps
          key: ${{ steps.release.outputs.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.release.outputs.job }}-
            ${{ steps.release.outputs.prefix }}
      # A restored cache entry is one this job uses: keyed_at removes keys no run used for a day, judged by each one's
      # "used" file, which the restore brings back with the saving run's time, so the first new key made removes them.
      - name: Mark the restored cache entries used
        shell: bash
        run: if [ -d ~/.mmt/exposure ]; then find ~/.mmt/exposure -mindepth 3 -maxdepth 3 -name used -exec touch {} +; fi
      - name: Port and link this job's mods
        # Under the job's 40 so the save below still runs when the port runs out of time.
        timeout-minutes: 36
        # bash by name runs with pipefail: without it the tee below hid a failed port, and the job passed with no summary.
        shell: bash
        run: |
          IFS=: read -r LOADER FROM TO <<< "$UPDATE"
          mkdir -p summary
          python bench/exposure.py jars $VERIFY --loader "$LOADER" --from "$FROM" --to "$TO" --out summary | tee -a "$GITHUB_STEP_SUMMARY"
      # Saved when the port fails or runs out of time too: the route maps and finished ports are right either way, and a
      # long port that never finished never kept them, so every run after it started cold and ran out of time again.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.mmt/exposure/registries
            ~/.mmt/exposure/ports
            ~/.mmt/exposure/maps
          key: ${{ steps.release.outputs.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      # overwrite: a re-run of a failed job replaces the part its first attempt left.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exposure-${{ strategy.job-index }}
          path: summary/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
  summary:
    needs: [plan, update]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # By run id: every artifact of the run, whichever attempt uploaded it, so a re-run's rows join the first attempt's.
      - uses: actions/download-artifact@v4
        with:
          pattern: exposure-*
          path: artifacts
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Join every update into one table
        run: |
          python3 bench/exposure.py join artifacts --out all.json | tee summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "$GITHUB_SHA" > commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: summary
          path: |
            summary.md
            all.json
            commit.txt
          overwrite: true
          retention-days: 90
      - name: Ports with no row
        if: needs.update.result != 'success'
        env:
          ATTEMPT: ${{ github.run_attempt }}
          RUN: ${{ github.run_id }}
        run: |
          missing=$(python3 -c "import json; print(', '.join(json.load(open('all.json'))['missing']) or 'none')")
          if [ "$ATTEMPT" = 1 ]; then
            msg="Jobs failed; ports with no row: $missing. Re-run only those: gh run rerun $RUN --failed"
          else
            msg="Jobs failed again on attempt $ATTEMPT; ports with no row: $missing. A job that fails twice is a real failure: read its log, don't re-run it."
          fi
          echo "::error title=Scoreboard incomplete::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          exit 1
