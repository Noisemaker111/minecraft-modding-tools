name: Cloud jar scoreboard
# The jar scoreboard (python bench/exposure.py all) on GitHub's runners: one ubuntu-latest job per update and loader
# (python bench/exposure.py updates), each downloading its release's pinned mods (bench/exposure/mods/), porting them
# with JarPort and linking them against the next release; the summary job joins them into the all-updates table
# (python bench/exposure.py join). A job downloads about 1 GB (the game twice, its loader, 150 mods) in under a minute, so
# only small kept answers are cached: each release's registry report (its data generator, a third of a job's time) and the
# ports and Exposure answers of the sweep before. The published files the porter downloads (intermediary, Mojang's
# mappings, Fabric API) are kept one cache entry each (.github/actions/downloads): Fabric's maven reset connections when a
# sweep's jobs all downloaded them at once. The sweep ports every mod and asks Exposure everything again (--verify)
# and fails where a kept answer with the same key differs: the check that the cache agents use locally is exact.
#
# Main's table is made once per commit: every push to main runs this, and the record job saves the table as
# scoreboard/all.json on the generated branch, never on main, with the port.jar-links points and the site rebuilt in the
# same commit (python bench/generated.py publish, pushed with the DOCS_DEPLOY_KEY deploy key as generated.yml does).
# A commit to main would put every open pull request behind. A pull request runs only its own branch: tools/cloud-run exposure
# finds this run's table for the branch's base, or dispatches one for that commit (-f commit=SHA) when none ran.
# paths-ignore lists what cannot change the table; tools/cloud-run reads it to treat a commit that only changed those
# files as the same table as its parent.
run-name: "Cloud jar scoreboard: ${{ inputs.only || 'every update' }}${{ inputs.commit && format(' at {0}', inputs.commit) || '' }} ${{ inputs.request }}"
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "bench/exposure/jars-*.json"
      - "bench/exposure/load-*.json"
      - "coverage/measures.json"
      - "coverage/roadmap.json"
      - "coverage/roadmap/**"
      - "coverage/ledger.json"
      - "app/**"
  workflow_dispatch:
    inputs:
      only:
        description: LOADER:FROM updates, comma-separated (empty for every update of both loaders)
        default: ''
      commit:
        description: The commit to run (default the branch's head); tools/cloud-run sets it to a branch's base on main
        default: ''
      request:
        description: Set by tools/cloud-run to find the run it started
        default: ''
permissions:
  contents: read
# Every push to main gets its own sweep, none cancelled: a pull request on any commit of main finds its table. (One group
# for main's pushes let GitHub cancel each waiting push when a newer one came, and pull requests on those commits had none.)
# They may finish out of order; exposure.record_main keeps the newest commit's table.
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      updates: ${{ steps.plan.outputs.updates }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
        run: echo "updates=$(python3 bench/exposure.py updates ${ONLY:+--only "$ONLY"})" >> "$GITHUB_OUTPUT"
  update:
    needs: plan
    name: ${{ matrix.update }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        update: ${{ fromJSON(needs.plan.outputs.updates) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UPDATE: ${{ matrix.update }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.mmt/exposure/registries
            ~/.mmt/exposure/ports
            ~/.mmt/exposure/game
            ~/.mmt/exposure/maps
          key: exposure-kept-${{ matrix.update }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: exposure-kept-${{ matrix.update }}-
      # The published files the porter downloads (intermediary, Mojang's mappings and jars, Fabric API), one cache entry each.
      - uses: ./.github/actions/downloads
        with:
          mode: restore
          job: exposure-${{ matrix.update }}
      - name: Port and link this update's mods
        # Under the job's 40 so the save below still runs when the port runs out of time.
        timeout-minutes: 36
        # bash by name runs with pipefail: without it the tee below hid a failed port, and the job passed with no summary.
        shell: bash
        run: |
          IFS=: read -r LOADER FROM TO <<< "$UPDATE"
          mkdir -p summary
          python bench/exposure.py jars --verify --loader "$LOADER" --from "$FROM" --to "$TO" --out "summary/$LOADER-$FROM-$TO.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/downloads
        if: always()
        with:
          mode: save
          job: exposure-${{ matrix.update }}
      # Saved when the port fails or runs out of time too: the route maps and finished ports are right either way, and a
      # long port that never finished never kept them, so every run after it started cold and ran out of time again.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.mmt/exposure/registries
            ~/.mmt/exposure/ports
            ~/.mmt/exposure/game
            ~/.mmt/exposure/maps
          key: exposure-kept-${{ matrix.update }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exposure-${{ strategy.job-index }}
          path: summary/
          if-no-files-found: ignore
          retention-days: 14
  summary:
    needs: update
    if: always() && needs.update.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: exposure-*
          path: artifacts
      - name: Join every update into one table
        env:
          COMMIT: ${{ inputs.commit || github.sha }}
        run: |
          python3 bench/exposure.py join artifacts --out all.json | tee summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "$COMMIT" > commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: summary
          path: |
            summary.md
            all.json
            commit.txt
          retention-days: 90
  record:
    # Only a whole sweep of a push to main is main's table; a partial one (an update failed) is not recorded.
    needs: [update, summary]
    if: github.event_name == 'push' && needs.update.result == 'success' && needs.summary.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # main as it is now builds the site; its history tells whether the table there is of a newer commit than this one.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: generated
          path: .runs/generated
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: summary
          path: ${{ runner.temp }}/summary
      - name: Save main's table and points to the generated branch
        env:
          TABLE: ${{ runner.temp }}/summary/all.json
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python bench/generated.py publish --dir .runs/generated --table "$TABLE" --commit "$GITHUB_SHA" --run "$RUN"
