name: CI
# The checks every pull request must pass (both are required on main): bench/run_tests.py on Linux and on Windows.
# The list of checks lives in bench/run_tests.py, not here. Server, plugin and Stonecutter checks are in integration.yml; heavy jobs (pack sweep, port
# board, perf A/B) are dispatched from cloud-*.yml with tools/cloud-run. No macOS: the code is not macOS-specific and
# its JFR sampling flaked (29 of 69 runs).
#
# A pull request pays for this once. A draft's pushes start no job (the agent proves each commit on its own machine with
# python bench/run_tests.py, which picks the checks the change can affect); marking it ready starts both jobs, and a push
# to a ready pull request starts them again. Each job's name is an expression, so that a draft's skipped job is never
# listed as "linux" or "windows": GitHub counts a skipped job as passed, those two names are what main requires, and it
# lists a skipped job under the expression's own text (seen on #225).
#
# Not on a merge to main: main takes only pull requests that are up to date with it, so the merged tree is the tree
# these jobs just passed. In the 73 merges after that rule (2026-11-22) the rerun on main failed 4 times, each a
# flaky test that passed on the next run, and found no break. Windows stays on the pull request: in the 60 pull requests to
# 2026-11-23 it alone caught a real break in 2 of them before they merged (#209: two mmt at once could not both unpack
# the package; a timer read as 2.0000000000000004 s), and no release has been cut since 2026-11-08 to catch one later.
#
# main runs it only to keep the caches: they are saved from main alone (a pull request's cache can be read by that pull
# request only), so a push that changes a file of the cache key runs the jobs once and saves them. After changing the
# cached paths below, or when a cache is gone, run it on main by hand (Actions > CI > Run workflow).
on:
  push:
    branches: [main]
    paths:
      - 'fixtures/prism-lab/build.gradle'
      - 'fixtures/prism-lab/settings.gradle'
      - 'fixtures/prism-lab/gradle.properties'
      - 'fixtures/prism-lab/gradle/wrapper/gradle-wrapper.properties'
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  linux:
    name: ${{ github.event.pull_request.draft && 'draft, linux not run' || 'linux' }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gradle and JDK caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
            ~/.mmt/test-libs
          key: ci-${{ runner.os }}-${{ hashFiles('fixtures/prism-lab/build.gradle', 'fixtures/prism-lab/settings.gradle', 'fixtures/prism-lab/gradle.properties', 'fixtures/prism-lab/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ci-${{ runner.os }}-
      - name: Offline checks
        run: python bench/run_tests.py --all
      - name: Stop Gradle before the cache save
        if: success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: pkill -f GradleDaemon || true
      - name: Save caches (main only)
        if: success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
            ~/.mmt/test-libs
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Receipts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runs
          path: .runs
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  windows:
    name: ${{ github.event.pull_request.draft && 'draft, windows not run' || 'windows' }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # A space in the path: the Windows launcher broke on it before.
          path: portable workspace
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gradle and JDK caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
            ~/.mmt/test-libs
          key: ci-${{ runner.os }}-${{ hashFiles('portable workspace/fixtures/prism-lab/build.gradle', 'portable workspace/fixtures/prism-lab/settings.gradle', 'portable workspace/fixtures/prism-lab/gradle.properties', 'portable workspace/fixtures/prism-lab/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ci-${{ runner.os }}-
      - name: Offline checks
        working-directory: portable workspace
        run: python bench/run_tests.py --all
      - name: Stop Java so Windows can read its cache locks
        if: success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: Get-Process java -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Save caches (main only)
        if: success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
            ~/.mmt/test-libs
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Receipts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runs
          path: portable workspace/.runs
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
