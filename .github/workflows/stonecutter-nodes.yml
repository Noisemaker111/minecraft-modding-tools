name: Stonecutter nodes (on demand)
# Every node of Diorama and In-Game Account Switcher: setup and compile through mmt on fresh
# pinned clones, on Linux (the build code is not OS-specific), no game. One job per node, so each job is one
# cold node (a few minutes; Forge decompiles take the longest) instead of a whole mod's 30+.
# No Gradle cache: a node is measured from first use, and per-node caches would evict the PR
# sample caches. Runs on demand (a change to the build or a mod pin), never blocks a merge; PRs run
# stonecutter-sample. No schedule: the clones are pinned, so a nightly run repeated the last answer, and from
# Nov 2 to Nov 7, 2026 one of its 100 jobs failed every night with nobody looking.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      first: ${{ steps.nodes.outputs.first }}
      rest: ${{ steps.nodes.outputs.rest }}
    steps:
      - uses: actions/checkout@v7
      - id: nodes
        run: |
          set -o pipefail
          python3 bench/real-mods/run.py --only diorama-all,ias-all --matrix > "$RUNNER_TEMP/nodes.json"
          python3 - "$RUNNER_TEMP/nodes.json" <<'EOF'
          import json
          import sys
          sys.path.insert(0, "bench")
          import smallest_first
          # Forge's nodes decompile the game; the others set up in minutes.
          size = lambda t: ("forge" in t["node"].split("-")[1:], smallest_first.version(t["node"].split("-")[0]))
          smallest_first.plan(json.load(open(sys.argv[1], encoding="utf-8")), size, "a node that does not decompile, on the oldest game")
          EOF
  node:
    # The plan's other nodes, once node-first (the same steps on its smallest) passed: bench/smallest_first.py.
    needs: [plan, node-first]
    if: needs.plan.outputs.rest != '[]'
    name: ${{ matrix.target.mod }} ${{ matrix.target.node }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        target: ${{ fromJSON(needs.plan.outputs.rest) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env: &node-env
      MOD: ${{ matrix.target.mod }}
      NODE: ${{ matrix.target.node }}
    steps: &node-steps
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Setup and compile the node
        shell: bash
        run: python bench/real-mods/run.py --compile-nodes --only "$MOD" --node "$NODE" --cache "$RUNNER_TEMP/real-mods" --out "$RUNNER_TEMP/real-mods-results" --label "$MOD"
      - name: Artifact name
        if: always()
        id: name
        shell: bash
        run: echo "value=stonecutter-${{ runner.os }}-$MOD-${NODE//:/}" >> "$GITHUB_OUTPUT"
      - name: Node results and Gradle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.value }}
          path: |
            ${{ runner.temp }}/real-mods-results
            ${{ runner.temp }}/real-mods/logs
            ${{ runner.temp }}/real-mods/*/.runs/portable/*/*.log
            ${{ runner.temp }}/real-mods/*/.runs/portable/*/result.json
          include-hidden-files: true
          if-no-files-found: ignore
  node-first:
    needs: plan
    name: ${{ matrix.target.mod }} ${{ matrix.target.node }} (${{ matrix.os }}, first)
    strategy:
      matrix:
        os: [ubuntu-latest]
        target: ${{ fromJSON(needs.plan.outputs.first) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env: *node-env
    steps: *node-steps
