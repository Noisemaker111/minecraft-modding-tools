name: Integration
# Real servers and real builds, once, on Linux (none of this code is OS-specific; 3 systems gave 774 jobs and no
# failure only one system saw). On a pull request that touches their code, once it is ready (a draft's pushes start no
# job; a push to a ready pull request starts them again):
# - plugins: pinned server plugins on fresh clones through the packaged command (fast, jar, plugin-check on MockBukkit,
#   each break made on purpose; tools/tests/ServerPluginFixtures.java).
# - server-check: plugins on a real headless Paper server with a bot player, one part per job (scenario, bot, breaks;
#   tools/tests/ServerCheckFixtures.java).
# - stonecutter: three representative Stonecutter nodes set up and compiled through mmt; every node runs on
#   demand in stonecutter-nodes.yml.
# Not on a merge to main: main takes only pull requests that are up to date with it, so the merged tree is the tree the
# pull request ran these on, and a pull request that touched none of the paths below merges the code main already ran
# them on. In the 73 merges after that rule (2026-11-22) the rerun on main failed once, when a clone from GitHub was
# refused (403), and found no break.
# main runs it only to keep the caches: they are saved from main alone, so a push that changes a file of a cache key
# runs the jobs once and saves them. After changing the cached paths below, or when a cache is gone, run it on main by
# hand (Actions > Integration > Run workflow).
on:
  push:
    branches: [main]
    paths:
      - 'bench/server-plugins/manifest.json'
      - 'bench/real-mods/manifest.json'
      - 'knowledge/mcprotocollib.json'
      - 'knowledge/viaproxy.json'
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - 'mmt'
      - 'tools/launcher/**'
      - 'tools/cli/**'
      - 'tools/servercheck/**'
      - 'tools/plugincheck/**'
      - 'tools/tests/Server*'
      - 'tools/tests/server-check-*'
      - 'bench/server-plugins/**'
      - 'bench/real-mods/**'
      - 'knowledge/mockbukkit.json'
      - 'knowledge/mcprotocollib.json'
      - 'knowledge/viaproxy.json'
      - '.github/workflows/integration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  plugins:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Gradle and JDK caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
          key: plugins-${{ hashFiles('bench/server-plugins/manifest.json') }}
          restore-keys: plugins-
      - run: java tools/cli/Bootstrap.java . package --json
      - name: Server plugins through mmt
        run: java tools/tests/ServerPluginFixtures.java . build/distributions/mmt.jar
      - name: Save caches (main only)
        if: success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Receipts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugins-runs
          path: .runs
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  server-check:
    name: server-check (${{ matrix.part }})
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        part: [scenario, bot, breaks]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Paper, Gradle and JDK caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
            ~/.mmt/servers
            ~/.mmt/tools
          key: server-check-${{ matrix.part }}-${{ hashFiles('bench/server-plugins/manifest.json', 'knowledge/mcprotocollib.json', 'knowledge/viaproxy.json') }}
          restore-keys: server-check-${{ matrix.part }}-
      - run: java tools/cli/Bootstrap.java . package --json
      - name: Plugins on a real Paper server through mmt
        run: java tools/tests/ServerCheckFixtures.java . build/distributions/mmt.jar "${{ matrix.part }}"
      - name: Save caches (main only)
        if: success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
            ~/.mmt/servers
            ~/.mmt/tools
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Receipts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-check-${{ matrix.part }}-runs
          path: .runs
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  stonecutter:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gradle and JDK caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
          key: stonecutter-${{ hashFiles('bench/real-mods/manifest.json') }}
          restore-keys: stonecutter-
      - name: Set up and compile three nodes
        run: python bench/real-mods/run.py --compile-nodes --only diorama-26.3,diorama-1.21.1,ias-26.3-fabric --cache "${{ runner.temp }}/real-mods" --out "${{ runner.temp }}/real-mods-results" --label sample
      - name: Stop Gradle before the cache save
        if: success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: pkill -f GradleDaemon || true
      - name: Save caches (main only)
        if: success() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Node results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stonecutter-sample
          path: ${{ runner.temp }}/real-mods-results
          if-no-files-found: ignore
          retention-days: 7
