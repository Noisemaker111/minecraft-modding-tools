name: Desktop app
# cargo test for the desktop app (app/, Rust on Rune) when a ready pull request changes it: its scenes lay out and its
# verdicts read the CLI's JSON right. Linux only; the build's Rust and Rune are pinned in app/rust-toolchain.toml and
# app/Cargo.toml. A draft's pushes start no job, and a merge to main does not run it again (main takes only pull
# requests that are up to date with it, so the merged tree is the tree the pull request ran it on). main runs it only to
# keep the build cache, which is saved from main alone: when the crates or the toolchain change, or by hand.
on:
  push:
    branches: [main]
    paths: ['app/Cargo.lock', 'app/Cargo.toml', 'app/rust-toolchain.toml']
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  test:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libwayland-dev >/dev/null
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked
