name: Cloud game proof
# The game proof of a port (python bench/exposure.py load) on GitHub's runners, so agents prove ports without starting
# Minecraft on the owner's PC: one ubuntu-latest job per update (python bench/exposure.py load-plan), each porting the
# update's mods that link (or only -f mods=SLUG,...) with the libraries they need, starting them on a real server of the
# new release and then in a real client of it, on a virtual display with Mesa's software OpenGL. Each job uploads its
# load summary, named as load --save names it (load-LOADER-FROM-TO-COMMIT.json), and mmt's logs. Dispatch with
# tools/cloud-run load -f updates=neoforge:1.21.1:1.21.2; it downloads the summaries into .runs/cloud/ and compares each
# with the receipt main keeps for that update (bench/exposure/load-*.json). A mod that fails is a result, not a job
# failure; a job fails only when its run could not finish. Started only by dispatch. No caches, no retries.
run-name: "Cloud game proof: ${{ inputs.updates }} ${{ inputs.mods }} ${{ inputs.request }}"
on:
  workflow_dispatch:
    inputs:
      updates:
        description: LOADER:FROM:TO or LOADER:FROM (the next release), comma-separated
        required: true
      mods:
        description: Only these mods (Modrinth slugs, comma-separated), with the libraries they need; empty for every mod that links
        default: ''
      request:
        description: Set by tools/cloud-run to find the run it started
        default: ''
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      updates: ${{ steps.plan.outputs.updates }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          UPDATES: ${{ inputs.updates }}
        run: echo "updates=$(python3 bench/exposure.py load-plan "$UPDATES")" >> "$GITHUB_OUTPUT"
  load:
    needs: plan
    name: ${{ matrix.update }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        update: ${{ fromJSON(needs.plan.outputs.updates) }}
    runs-on: ubuntu-latest
    # Cold: the scoreboard's port of the update (about 2 minutes), then one server start per failure and the client
    # starts on software OpenGL.
    timeout-minutes: 120
    env:
      UPDATE: ${{ matrix.update }}
      MODS: ${{ inputs.mods }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Virtual display with software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 >/dev/null
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          # 26.x opens its window through SDL, which finds no matching GLX visual on Xvfb, so its client never starts
          # there; SDL's offscreen driver on Mesa's EGL does (as in cloud-convert.yml). Older releases' GLFW ignores it.
          echo "SDL_VIDEO_DRIVER=offscreen" >> "$GITHUB_ENV"
          ./mmt preferences --background on --quiet on
      - name: Port the mods, start them on a server and in a client
        run: |
          set -o pipefail
          IFS=: read -r LOADER FROM TO <<< "$UPDATE"
          mkdir -p summary
          python bench/exposure.py load --loader "$LOADER" --from "$FROM" --to "$TO" ${MODS:+--mods "$MODS"} \
            --out "summary/load-$LOADER-$FROM-$TO-${GITHUB_SHA::10}.json" | tee load.txt
          # A run with nothing to start has no verdict table, only why.
          { echo '```'; grep -A 1000 -e '^mod  ' -e '^no mod to start' load.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Game logs
        # pack-check keeps each start's server or client log and result.json in its own cache, outside the workspace;
        # the runner is fresh, so every run there is this job's.
        if: always()
        run: |
          mkdir -p logs
          for run in "$HOME"/.mmt/packs/.runs/portable/*/; do
            [ -d "$run" ] || continue
            mkdir -p "logs/$(basename "$run")"
            find "$run" -maxdepth 1 \( -name '*.log' -o -name 'result.json' \) -exec cp {} "logs/$(basename "$run")/" \;
          done
          echo "$(find logs -type f | wc -l) game log files"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-${{ strategy.job-index }}
          path: |
            summary/
            logs/
            load.txt
            .runs/exposure/load-*/report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
