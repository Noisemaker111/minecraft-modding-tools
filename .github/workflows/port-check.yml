name: Port check
# A pull request's check of the ports its change can move, in about one port's time: python bench/exposure.py
# check-plan reads the files the PR changed (against main), the "Port check:" line of its description and main's jar
# scoreboard (the generated branch), and picks the ports: the ones the description names (only its mods, or the mods a
# type of break holds back on main), the update whose stand-ins or pinned mods changed, the updates a changed change index
# makes, and, when the porter, its rules or the change index changed, which every port reads, a sample per loader (the
# fewest ports that would have caught every time a sweep of main found mods that stopped linking: portcheck.sample),
# never every port; its output says which and why. One job per port, side by side: it ports and links those mods (jars
# --mods) with the pull request and with its base commit (jars --at HEAD^1, beside it), and fails when a mod that links
# on the base stops linking with the pull request (gate --base; main's saved table is remade only by hand or at a
# release, so it is not what main does after a later merge), then starts the mods that newly link on a
# real server and, beside it, in a real client of the new release (load --mods; no server when each is client-only by its
# own metadata), the game proof at its smallest scope, which fails when a mod it started does not load (gate on the load
# receipt); a mod it could not start is said with why and fails nothing. The whole scoreboard (cloud-exposure.yml) runs only by hand and with each release.
#
# Started by the PR's own events: marked ready, or a push to a ready PR; a draft starts nothing, and a newer push
# replaces the run of the older head. A pull_request run from a fork runs the fork's copy of this file with a read-only
# token, so it uses no secret. It restores main's kept ports and maps; the one thing it saves is the base's small
# summary per pair (a few hundred KB), which only later runs of the same pull request can read.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
concurrency:
  group: port-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  plan:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      # The merge with main and its first parent, main: what the PR changes against main as it is now.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -o pipefail
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          python3 bench/exposure.py check-plan --changed "$RUNNER_TEMP/changed.txt" --body "$RUNNER_TEMP/body.md" --base HEAD^1 > "$RUNNER_TEMP/plan.json"
          python3 -c "import json,sys; print('\n'.join(json.load(open(sys.argv[1]))['why']))" "$RUNNER_TEMP/plan.json" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "jobs=$(python3 -c "import json,sys; print(json.dumps(json.load(open(sys.argv[1]))['jobs']))" "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
  port:
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    name: ${{ matrix.loader }} ${{ matrix.from }} -> ${{ matrix.to }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    runs-on: ubuntu-latest
    env:
      LOADER: ${{ matrix.loader }}
      FROM: ${{ matrix.from }}
      TO: ${{ matrix.to }}
      MODS: ${{ matrix.mods }}
    steps:
      # The merge with main and its first parent, main as the pull request is compared with: the base of the comparison.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The base's port of this pair and these mods, kept under what it is made of: the base commit's tree, the pair and
      # mods, and the scripts that summarize it. A push of the same pull request on the same main reads it back. Other
      # pull requests cannot: a pull request's cache is readable only by its own runs (and main's by all).
      - id: base
        run: |
          echo "tree=$(git rev-parse HEAD^1^{tree})" >> "$GITHUB_OUTPUT"
          echo "name=main at $(git rev-parse --short=10 HEAD^1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: kept-base
        with:
          path: base/port.json
          key: "port-base-${{ steps.base.outputs.tree }}-${{ matrix.loader }}:${{ matrix.from }}:${{ matrix.to }}-${{ matrix.mods }}-${{ hashFiles('bench/exposure.py', 'bench/port_tools.py', 'bench/portboard/**') }}"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.mmt/exposure/registries
            ~/.mmt/exposure/ports
            ~/.mmt/exposure/game
            ~/.mmt/exposure/maps
          key: "exposure-kept-${{ matrix.loader }}:${{ matrix.from }}:${{ matrix.to }}-"
          restore-keys: "exposure-kept-${{ matrix.loader }}:${{ matrix.from }}:"
      # The pull request's port and the base's (when not kept) side by side, each with half the memory: the gate compares
      # them, so a mod main itself stopped linking since its saved table fails no pull request.
      - name: Port and link against the base's port
        shell: bash
        env:
          BASE_NAME: ${{ steps.base.outputs.name }}
          MMT_HEAP_GB: '6'
        run: |
          mkdir -p summary base
          base=
          if [ ! -f base/port.json ]; then
            python bench/exposure.py jars --at HEAD^1 --loader "$LOADER" --from "$FROM" --to "$TO" ${MODS:+--mods "$MODS"} --out base/port.json > base.txt 2>&1 &
            base=$!
          fi
          python bench/exposure.py jars --loader "$LOADER" --from "$FROM" --to "$TO" ${MODS:+--mods "$MODS"} --out summary/port.json > jars.txt
          if [ -n "$base" ] && ! wait "$base"; then tail -n 30 base.txt; echo "the base's port failed"; exit 1; fi
          python bench/exposure.py gate summary/port.json --base base/port.json --base-name "$BASE_NAME" --freed freed.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.kept-base.outputs.cache-hit != 'true' && hashFiles('base/port.json') != '' }}
        with:
          path: base/port.json
          key: ${{ steps.kept-base.outputs.cache-primary-key }}
      - name: Mods that newly link
        id: freed
        if: always()
        run: echo "mods=$(cat freed.txt 2>/dev/null)" >> "$GITHUB_OUTPUT"
      - name: The Java the release runs on
        id: java
        if: ${{ !cancelled() && steps.freed.outputs.mods != '' }}
        # Only it, and 25 for mmt: the five a sweep needs took 27 s to download (neoforge 1.21.7 -> 1.21.8, 2026-11-23).
        run: |
          runs=$(python -c "import sys; sys.path.insert(0, 'bench'); from portboard.javalevels import release_java; print(release_java(sys.argv[1]))" "$TO")
          { echo "versions<<EOF"; [ "$runs" = 25 ] || echo "$runs"; echo 25; echo EOF; } >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() && steps.freed.outputs.mods != '' }}
        uses: ./.github/actions/game
        with:
          java: ${{ steps.java.outputs.versions }}
      - if: ${{ !cancelled() && steps.freed.outputs.mods != '' }}
        name: Start them on a server and in a client
        env:
          FREED: ${{ steps.freed.outputs.mods }}
        run: |
          set -o pipefail
          status=0
          receipt="summary/load-$LOADER-$FROM-$TO-${GITHUB_SHA::10}.json"
          PYTHONUNBUFFERED=1 python bench/exposure.py load --loader "$LOADER" --from "$FROM" --to "$TO" --mods "$FREED" \
            --out "$receipt" 2>&1 | tee load.txt || status=$?
          { echo '```'; grep -A 1000 '^mod  ' load.txt || tail -n 5 load.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # load keeps a receipt when its starts ran, whatever they found, and when it could start nothing (it then ends
          # with why); the gate judges the receipt: it fails only when a mod it started does not load. No receipt: load
          # itself failed, and its status stands.
          if [ -f "$receipt" ]; then status=0; python bench/exposure.py gate "$receipt" | tee -a "$GITHUB_STEP_SUMMARY" || status=$?; fi
          exit "$status"
      - if: ${{ !cancelled() && steps.freed.outputs.mods != '' }}
        uses: ./.github/actions/game-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: port-${{ strategy.job-index }}
          path: |
            summary/
            jars.txt
            base.txt
            base/
            load.txt
            logs/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
