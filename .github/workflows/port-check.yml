name: Port check
# A pull request's check of the ports its change can move: python bench/exposure.py
# check-plan reads the files the PR changed (against main), the "Port check:" line of its description and main's jar
# scoreboard (the generated branch), and picks the ports: the ones the description names (only its mods, or the mods a
# type of break holds back on main), the update whose stand-ins or pinned mods changed, the updates a changed change index
# makes, and, when the porter, its rules or the change index changed, which every port reads, a sample per loader (the
# fewest ports that would have caught every time a sweep of main found mods that stopped linking: portcheck.sample),
# never every port; its output says which and why. Each port is two jobs side by side, each on a runner of its own: one
# ports and links those mods (jars --mods) with the pull request, the other with its base commit (jars --at HEAD^1). Run
# one after the other in one job they took 4 to 6 minutes, the base's port alone 50 to 140 s of it. The gate job then
# fails when a mod that links on the base stops linking with the pull request (gate --base; main's saved table is remade
# only by hand or at a release, so it is not what main does after a later merge), and names the mods that newly link.
# It starts no game: starting the freed mods on a real server and client here took 26 minutes and more for one port (39
# mods, 2026-11-25) and ran again on every push, so pull requests sat waiting on it; tools/cloud-run load starts them by
# hand. The whole scoreboard (cloud-exposure.yml) runs only by hand and with each release.
#
# Started by the PR's own events: marked ready, or a push to a ready PR; a draft starts nothing, and a newer push
# replaces the run of the older head. A pull_request run from a fork runs the fork's copy of this file with a read-only
# token, so it uses no secret. Every run ports both sides from the jars and the game: nothing is kept between runs.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
concurrency:
  group: port-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  plan:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      # The merge with main and its first parent, main: what the PR changes against main as it is now.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -o pipefail
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          python3 bench/exposure.py check-plan --changed "$RUNNER_TEMP/changed.txt" --body "$RUNNER_TEMP/body.md" --base HEAD^1 > "$RUNNER_TEMP/plan.json"
          python3 -c "import json,sys; print('\n'.join(json.load(open(sys.argv[1]))['why']))" "$RUNNER_TEMP/plan.json" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "jobs=$(python3 -c "import json,sys; print(json.dumps(json.load(open(sys.argv[1]))['jobs']))" "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
  port:
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    name: ${{ matrix.job.loader }} ${{ matrix.job.from }} -> ${{ matrix.job.to }} (${{ matrix.side }})
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
        side: [pull request, base]
    runs-on: ubuntu-latest
    env:
      LOADER: ${{ matrix.job.loader }}
      FROM: ${{ matrix.job.from }}
      TO: ${{ matrix.job.to }}
      MODS: ${{ matrix.job.mods }}
    steps:
      # The merge with main and its first parent, main as the pull request is compared with: the base of the comparison.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # A NeoForge 1.21.1 port's JVM alone is 6.9 GB (6 GB heap and the rest) of the runner's 16 GB.
      - name: Port and link
        shell: bash
        env:
          AT: ${{ matrix.side == 'base' && '--at HEAD^1' || '' }}
          MMT_HEAP_GB: '6'
        run: |
          mkdir -p out
          python bench/exposure.py jars $AT --loader "$LOADER" --from "$FROM" --to "$TO" ${MODS:+--mods "$MODS"} --out out/port.json 2>&1 | tee out/jars.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "port-${{ matrix.job.loader }}-${{ matrix.job.from }}-${{ matrix.job.to }}-${{ matrix.side == 'base' && 'base' || 'pr' }}"
          path: out/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
  # Each port's verdict: the pull request's summary against the base's, the same mods of the same pair.
  gate:
    needs: [plan, port]
    if: needs.plan.outputs.jobs != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          pattern: port-*
          path: ports
      - name: Gate each port against its base
        shell: bash
        env:
          JOBS: ${{ needs.plan.outputs.jobs }}
        run: |
          set -o pipefail
          base="main at $(git rev-parse --short=10 HEAD^1)"
          failed=0
          for pair in $(jq -r '.[] | "\(.loader)-\(.from)-\(.to)"' <<< "$JOBS"); do
            python3 bench/exposure.py gate "ports/port-$pair-pr/port.json" --base "ports/port-$pair-base/port.json" --base-name "$base" | tee -a "$GITHUB_STEP_SUMMARY" || failed=1
          done
          exit $failed
